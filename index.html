<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="blog">
    <article class="blog-card">
      <img class="blog-image" src="./assets/images/illustration-article.svg">
      <div class="blog-info">
        <span class="blog-tag">Learning</span>
        <span class="blog-publish-date">Published 21 Dec 2023</span>
        <h1 class="blog-title">HTML & CSS foundations</h1>
        <p class="blog-brief">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
      <div class="blog-author">
        <img class="author-avatar" src="./assets/images/image-avatar.webp">
        <span class="author-name">Greg Hopper</span>
      </div>
    </article>
  </main>
</body>
</html>
